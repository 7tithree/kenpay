services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kenpay
    ports:
      - "5432:5432"
    volumes:
      - kenpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kenpay
      AUTH_SECRET: change-me-to-a-long-random-string
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / MAIL_FROM for payslip email
    ports:
      - "3000:3000"
    # First boot: create tables, then start the server
    command: sh -c "npx prisma db push --skip-generate && node server.js"

volumes:
  kenpay_pgdata:
